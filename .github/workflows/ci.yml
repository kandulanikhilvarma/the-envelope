name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Cheap backstop: a real key or secret should never reach the repo.
      # .env.example is the only committed env file and holds placeholders.
      - name: Guard against committed secrets
        run: |
          if git ls-files | grep -E '^\.env' | grep -v '^\.env\.example$'; then
            echo "A non-template .env file is tracked. Remove it."
            exit 1
          fi
          if grep -rInE '(sk_live_|whsec_[A-Za-z0-9]{16,})' \
             --include='*.ts' --include='*.tsx' --include='*.json' \
             --exclude-dir=node_modules . ; then
            echo "Possible live secret committed."
            exit 1
          fi
